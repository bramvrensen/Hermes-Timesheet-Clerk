name: timesheet-clerk
version: 0.1.3
description: HERMES Timesheet Clerk tools and skill for Clockify/Simplicate planning context.
entrypoint: plugin.py
author: Bram van Rensen
homepage: https://github.com/bramvrensen/Hermes-Timesheet-Clerk

provides_tools:
  - timesheet_clockify_entries
  - timesheet_simplicate_context
  - timesheet_simplicate_assignments
  - timesheet_simplicate_booked_hours

requires_env:
  - name: CLOCKIFY_API_KEY
    description: Clockify personal API key
    url: https://app.clockify.me/user/settings
    secret: true
  - name: CLOCKIFY_WORKSPACE_ID
    description: Clockify workspace ID used for timesheet entries
    secret: false
  - name: CLOCKIFY_USER_ID
    description: Clockify user ID whose time entries should be processed
    secret: false
  - name: SIMPLICATE_BASE_URL
    description: Simplicate API v2 base URL, for example https://company.simplicate.nl/api/v2
    secret: false
  - name: SIMPLICATE_API_KEY
    description: Simplicate API authentication key
    secret: true
  - name: SIMPLICATE_API_SECRET
    description: Simplicate API authentication secret
    secret: true
  - name: SIMPLICATE_EMPLOYEE_ID
    description: Simplicate employee ID for the user whose planning and hours are processed
    secret: false
